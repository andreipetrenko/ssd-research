# OpenSpec project config for the business/system specifications repository.
# Check field support with `openspec schema validate sdd` for the installed OpenSpec version.
schema: sdd

context: |
  Репозиторий бизнес- и функциональных спецификаций процесса SDD.
  Одно изменение = одна папка openspec/changes/<Change ID>/ (например, CHG-1042).
  В папке два артефакта: business-spec.md (бизнес-аналитик) и functional-spec.md (системный аналитик).
  Источники фактов: Business Idea в Jira, согласованная бизнес-спецификация, код и спецификации
  в репозитории приложения. Язык документов — русский.
  Jira-задачи создаёт Integration Service после merge PR; агент их не создаёт.

rules:
  business-spec:
    - Заполняй метаданные: Change ID, исходная Jira (Business Idea), автор бизнес-требования.
    - Не придумывай бизнес-правила и цифры, которых нет в источниках; неизвестное выноси в «Открытые вопросы».
    - Разделяй факты, предложения и допущения (помечай «Допущение:»).
    - Критерии приёмки — только в формате Дано / Когда / Тогда, включая негативные сценарии.
    - Не описывай техническую реализацию (API, таблицы) — это задача функциональной спецификации.
  functional-spec:
    - В метаданных укажи commit согласованной бизнес-спецификации и ключ Jira-задачи системного анализа.
    - Не придумывай API, поля данных и правила, отсутствующие в источниках; ссылайся на файлы и разделы.
    - Каждое требование связывай с разделом бизнес-спецификации.
    - Декомпозицию оформляй строками «- DEV-1: Название», зависимости — «- Зависимости:» и строками «DEV-2 после DEV-1».
    - Не включай секреты и персональные данные.
