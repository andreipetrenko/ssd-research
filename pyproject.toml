[project]
name = "sdd-orchestrator"
version = "0.1.0"
description = "Integration Service для SDD MVP: переходы Bitbucket PR → Jira по спецификациям OpenSpec"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
sdd = "sdd_orchestrator.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdd_orchestrator", "src/sdd_mocks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
